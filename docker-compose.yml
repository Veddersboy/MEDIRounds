services:
  postgres:
    image: postgres:18
    container_name: medirounds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medirounds_app
      POSTGRES_PASSWORD: pasword123
      POSTGRES_DB: medirounds_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: medirounds-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
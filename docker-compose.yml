services:
  postgres:
    image: postgres:18
    container_name: medirounds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medirounds_app
      POSTGRES_PASSWORD: pasword123
      POSTGRES_DB: medirounds_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: medirounds-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  mailpit:
    image: axllent/mailpit:latest
    container_name: medirounds-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # Catching SMTP
      - "8025:8025" # Fake inbox
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 500
    volumes:
      - mailpit_data:/data

volumes:
  postgres_data:
  mailpit_data:
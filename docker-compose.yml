services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medirounds-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medirounds-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://medirounds_app:pasword123@postgres:5432/medirounds_db
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      - postgres

  postgres:
    image: postgres:18
    container_name: medirounds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medirounds_app
      POSTGRES_PASSWORD: pasword123
      POSTGRES_DB: medirounds_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: medirounds-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: